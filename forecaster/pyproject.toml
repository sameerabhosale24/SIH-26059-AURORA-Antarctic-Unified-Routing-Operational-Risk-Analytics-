[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-forecaster"
version = "1.0.0"
description = "Pure inference kernel for the AURORA Antarctic sea-ice (SIC) forecaster: 5-day tensor in, 3-day SIC forecast out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

# The package directory is forecaster/src/ (see README, "Repository layout"),
# so it is mapped onto the import name `forecaster` explicitly. A plain
# [tool.setuptools.packages.find] where = ["src"] would discover nothing here:
# find only walks SUBdirectories of `where`, and src/ itself is the package.
[tool.setuptools]
package-dir = { "forecaster" = "src" }
packages = ["forecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
